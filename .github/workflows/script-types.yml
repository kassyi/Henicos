name: Script types

# Type-checks the TypeScript scripts (scripts/**/*.ts) with tsc, checks the frontmatter of the agent rule files, and
# runs the self-tests of the job queue and the GPU lock on Ubuntu and Windows. Node runs the scripts as they are by
# stripping the types, so a type error would otherwise only show when the code runs. It needs no .NET build, only Node.
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - ".agents/rules/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/script-types.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/**"
      - ".agents/rules/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/script-types.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types and job queue (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The oldest Node the scripts support runs .ts files as they are from 22.18 on; check with that one
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"

      # The hook reads the queue options of a conditional recipe with `just --dry-run`, so its checks need just: the
      # release binary, checked against the SHA-256 of the release's SHA256SUMS
      - name: Install just
        shell: bash
        env:
          JUST_VERSION: "1.49.0"
          JUST_SHA256_LINUX: 05eb2f068b641b06e5b318796c2e27d4dcca608e65b34329a08c1b9f582611bd
          JUST_SHA256_WINDOWS: 657338772efd17a31d67285bb5ed691da87741e44311c0366273c6cb7d913b15
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            asset="just-$JUST_VERSION-x86_64-pc-windows-msvc.zip"; sum="$JUST_SHA256_WINDOWS"
          else
            asset="just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"; sum="$JUST_SHA256_LINUX"
          fi
          dir="$RUNNER_TEMP/just"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$asset" "https://github.com/casey/just/releases/download/$JUST_VERSION/$asset"
          echo "$sum  $dir/$asset" | sha256sum -c -
          if [ "$RUNNER_OS" = "Windows" ]; then unzip -q "$dir/$asset" just.exe -d "$dir"; else tar -xzf "$dir/$asset" -C "$dir" just; fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/just" --version

      - name: Type check
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/human/check-types.js

      # Antigravity loads a rule file only with valid frontmatter; a file without it is dropped silently
      - name: Rule file frontmatter
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/human/check-rule-frontmatter.js --self-test
          node scripts/human/check-rule-frontmatter.js

      - name: Job queue self-test
        run: |
          node scripts/human/job-queue.js --self-test
          node scripts/human/provision-remote-worker.js --self-test

      - name: Job queue hook self-test
        run: node scripts/agent/check-queued-command.js --self-test

      # The GPU lock (both seats, stale takeover, a run killed while it holds the seats) needs no GPU: without
      # nvidia-smi the hold is recorded as not sampled. It uses a private lock path, never the real lock.
      - name: GPU lock self-test
        timeout-minutes: 5
        run: node scripts/human/gpu-lock.js --self-test
