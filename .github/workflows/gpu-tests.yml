name: Hybrid CI Tests

# Static, syntax and CPU tests on GitHub-hosted runners (no CUDA).
# - Ubuntu runs for every pull request and every push to main.
# - Windows runs only after Ubuntu passed, and only for a push to main or a pull request labeled "full-ci".
#   Windows minutes cost twice as much and a Windows run takes twice as long, so a pull request gets one
#   Windows run, right before its merge (see .agents/rules/test-execution.md). A push to main always runs
#   Windows, so a merge without the label is still tested there.
on:
  push:
    branches: ["main"]
    paths-ignore: # a change to these alone runs no test
      - "docs/**"
      - ".agents/**"
      - "**/*.md"
  pull_request: # every base branch, so a PR stacked on another PR is tested too
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: # a change to these alone runs no test
      - "docs/**"
      - ".agents/**"
      - "**/*.md"

jobs:
  test-ubuntu:
    name: Run Static & Syntax Tests (ubuntu-latest)
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    # A new run for the same pull request or branch cancels this job while it is still running.
    concurrency:
      group: ${{ github.workflow }}-test-ubuntu-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      GSHARP_TEST_NO_CUDA: "1"
      DiffEngine_Disabled: "true"

    steps:
      - name: Enable long paths in Git (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore -c Release

      - name: Run Static Compilation & Syntax Tests
        env:
          GSHARP_TEST_NO_CUDA: "1"
        run: dotnet test --filter "Category!=GpuExecution" --no-build -c Release

      - name: Run CPU Native Toolchain Execution Tests
        env:
          GSHARP_TEST_NO_CUDA: "1"
        run: dotnet test tests/Compiler/Kassyi.GSharp.Tests.Cpu/Kassyi.GSharp.Tests.Cpu.csproj --filter "Category=GpuExecution&Category!=Stress&Category!=Benchmark" --no-build -c Release

  test-windows:
    name: Run Static & Syntax Tests (windows-latest)
    needs: test-ubuntu
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: windows-latest
    # A new run for the same pull request or branch cancels this job while it is still running.
    concurrency:
      group: ${{ github.workflow }}-test-windows-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      GSHARP_TEST_NO_CUDA: "1"
      DiffEngine_Disabled: "true"

    steps:
      - name: Enable long paths in Git (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore -c Release

      - name: Run Static Compilation & Syntax Tests
        env:
          GSHARP_TEST_NO_CUDA: "1"
        run: dotnet test --filter "Category!=GpuExecution" --no-build -c Release

      - name: Run CPU Native Toolchain Execution Tests
        env:
          GSHARP_TEST_NO_CUDA: "1"
        run: dotnet test tests/Compiler/Kassyi.GSharp.Tests.Cpu/Kassyi.GSharp.Tests.Cpu.csproj --filter "Category=GpuExecution&Category!=Stress&Category!=Benchmark" --no-build -c Release
