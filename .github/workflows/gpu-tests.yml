name: Hybrid CI Tests

# Static, syntax and CPU tests on GitHub-hosted runners (no CUDA).
# Ubuntu and Windows run side by side for every pull request and every push to main. The repository is public, so
# GitHub-hosted runners have no minute limit on either OS.
on:
  push:
    branches: ["main"]
    paths-ignore: # a change to these alone runs no test
      - "docs/**"
      - ".agents/**"
      - "**/*.md"
  pull_request: # every base branch, so a PR stacked on another PR is tested too
    types: [opened, synchronize, reopened]
    paths-ignore: # a change to these alone runs no test
      - "docs/**"
      - ".agents/**"
      - "**/*.md"

permissions:
  contents: read

# A new run for the same pull request or branch cancels the one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Static & Syntax Tests (${{ matrix.os }})
    strategy:
      fail-fast: false # a failure on one OS does not cancel the other
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GSHARP_TEST_NO_CUDA: "1"
      DiffEngine_Disabled: "true"

    steps:
      - name: Enable long paths in Git (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore -c Release

      - name: Run Static Compilation & Syntax Tests
        env:
          GSHARP_TEST_NO_CUDA: "1"
        run: dotnet test --filter "Category!=GpuExecution" --no-build -c Release

      - name: Run CPU Native Toolchain Execution Tests
        env:
          GSHARP_TEST_NO_CUDA: "1"
        run: dotnet test tests/Compiler/Kassyi.GSharp.Tests.Cpu/Kassyi.GSharp.Tests.Cpu.csproj --filter "Category=GpuExecution&Category!=Stress&Category!=Benchmark" --no-build -c Release
