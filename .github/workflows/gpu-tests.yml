name: GPU Optimization Tests

# Trigger only on pushes to main; never on pull_request events.
# Self-hosted runners are high-value targets: running repo-controlled scripts
# from untrusted PRs would allow any contributor with write access to RCE the runner.
on:
  push:
    branches: ["main"]

jobs:
  test-on-gpu:
    name: Run Tests on Self-Hosted GPU Runner
    runs-on: [self-hosted, gpu, windows]

    # Require explicit deployment-environment approval before executing on the runner.
    # Configure the "github-gpu-runner" environment in Settings > Environments with required reviewers.
    environment: github-gpu-runner

    # Defence-in-depth: even if the above environment gate is misconfigured, only
    # pushes that have already landed on main are allowed (i.e. code has been reviewed).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Pin the checkout action to a specific commit SHA instead of a mutable tag to
      # prevent tag-hijacking supply-chain attacks. Equivalent to actions/checkout@v4.3.0.
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # .NET SDK is already installed on the self-hosted runner, avoiding actions/setup-dotnet
      # to prevent UAC write permission issues to C:\Program Files\dotnet.
      - name: Verify .NET SDK Version
        run: |
          $version = dotnet --version
          if ($version -notmatch "^10\.0\.") {
              Write-Error ".NET SDK 10.0.x is required, but found $version"
              exit 1
          }

      # Ensure CUDA Toolkit is available (pre-installed on the runner).
      - name: Verify CUDA Installation
        run: nvcc --version

      - name: Restore dependencies
        run: dotnet restore

      # Build the native CUDA DLL inline rather than delegating to a repo-controlled .bat.
      # This removes the "run arbitrary script from checkout" attack surface: every command
      # below is controlled by the workflow file (which lives on the already-reviewed main
      # branch), not by a separately-editable helper script.
      - name: Build Native CUDA Library
        shell: cmd
        run: |
          :: Locate Visual Studio via vswhere
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          if not defined VS_PATH (
            echo Error: Visual Studio C++ compiler not found. && exit /b 1
          )
          set VCVARS=%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat
          if not exist "%VCVARS%" (
            echo Error: vcvars64.bat not found at %VCVARS%. && exit /b 1
          )
          call "%VCVARS%"

          :: Locate NVCC
          set NVCC_CMD=nvcc.exe
          if defined CUDA_PATH (
            set NVCC_CMD=%CUDA_PATH%\bin\nvcc.exe
          ) else (
            for /f "delims=" %%d in ('dir /b /ad "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\" 2^>nul ^| sort /r') do (
              if exist "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\%%d\bin\nvcc.exe" (
                set NVCC_CMD=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\%%d\bin\nvcc.exe
                goto :nvcc_found
              )
            )
          )
          :nvcc_found

          :: Build
          set SRC=src\Native\Kassyi.GSharp.Stdlib.Math.Cuda
          set OUT=%SRC%\Kassyi.GSharp.GpuBigInt.Cuda.dll
          "%NVCC_CMD%" -shared -o "%OUT%" "%SRC%\GpuBigInt.cu" -lcufft -O3 -arch=sm_86 -std=c++17 -Xcompiler "/wd 4819"
          if %errorlevel% neq 0 ( echo Build Failed! && exit /b %errorlevel% )
          echo Build Succeeded: %OUT%

      - name: Build project
        run: dotnet build --no-restore -c Release

      - name: Run Static Compilation Tests (Physical GPU not required)
        run: dotnet test tests/Kassyi.GSharp.Tests --filter ArchitectureAndOptimizationTests --no-build -c Release

      - name: Run Execution Tests (Requires physical GPU)
        run: dotnet test tests/Kassyi.GSharp.Tests --filter "PtxEngineExperimentTests|SourceGeneratorTests" --no-build -c Release
