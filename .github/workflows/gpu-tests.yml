name: GPU Optimization Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-on-gpu:
    name: Run Tests on Self-Hosted GPU Runner
    # Using 'self-hosted' and 'gpu' labels to target the user's home PC or dedicated GPU machine
    runs-on: [self-hosted, gpu, windows]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # .NET SDK is already installed on the self-hosted runner, avoiding actions/setup-dotnet
    # to prevent UAC write permission issues to C:\Program Files\dotnet.

    # Ensure CUDA Toolkit is available (usually pre-installed on the self-hosted runner)
    - name: Verify CUDA Installation
      run: nvcc --version

    - name: Restore dependencies
      run: dotnet restore

    # Build Native CUDA DLL required by Kassyi.GSharp.Stdlib.Math
    - name: Build Native CUDA Library
      run: .\src\Native\Kassyi.GSharp.Stdlib.Math.Cuda\build.bat

    - name: Build project
      run: dotnet build --no-restore -c Release

    - name: Run Static Compilation Tests (Physical GPU not required for execution)
      run: dotnet test tests/Kassyi.GSharp.Tests --filter ArchitectureAndOptimizationTests --no-build -c Release

    - name: Run Execution Tests (Requires physical GPU matching compiled architecture)
      run: dotnet test tests/Kassyi.GSharp.Tests --filter "PtxEngineExperimentTests|SourceGeneratorTests" --no-build -c Release
