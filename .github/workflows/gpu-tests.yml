name: Hybrid CI Tests

# Hybrid CI Architecture:
# - Job 1 (Static/Syntax Tests): Runs instantly on GitHub Cloud for all pushes and PRs.
# - Job 2 (GPU Execution Tests): Runs on Self-Hosted Runner. 
#   Securely gated to only run on pushes to main or PRs from internal branches.
on:
  push:
    branches: ["main"]
  pull_request: # every base branch, so a PR stacked on another PR is tested too

jobs:
  test-static-cloud:
    name: Run Static & Syntax Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      GSHARP_TEST_NO_CUDA: "1"
      DiffEngine_Disabled: "true"
    # Runs on all pushes and PRs safely because it is sandboxed in GitHub's cloud

    steps:
      - name: Enable long paths in Git (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore -c Release

      - name: Run Static Compilation & Syntax Tests
        env:
          GSHARP_TEST_NO_CUDA: "1"
        run: dotnet test --filter "Category!=GpuExecution" --no-build -c Release

      - name: Run CPU Native Toolchain Execution Tests
        env:
          GSHARP_TEST_NO_CUDA: "1"
        run: dotnet test tests/Compiler/Kassyi.GSharp.Tests.Cpu/Kassyi.GSharp.Tests.Cpu.csproj --filter "Category=GpuExecution&Category!=Stress&Category!=Benchmark" --no-build -c Release

