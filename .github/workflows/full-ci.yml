name: Full CI

# Windows run for a pull request at the moment the "full-ci" label is added.
# Ubuntu does not run here: the label is added after the Ubuntu run of Hybrid CI (gpu-tests.yml) passed
# (see .agents/rules/test-execution.md). Later pushes to the pull request run Ubuntu, then Windows, in gpu-tests.yml.
# Any other label gives a run of this workflow whose job is skipped; its check has its own name, so it does not replace
# the check results of Hybrid CI.
# Keep the test-windows steps the same as in gpu-tests.yml.
on:
  pull_request:
    types: [labeled]
    paths-ignore: # a change to these alone runs no test
      - "docs/**"
      - ".agents/**"
      - "**/*.md"

jobs:
  test-windows:
    name: Run Static & Syntax Tests (windows-latest, full-ci)
    if: github.event.label.name == 'full-ci'
    runs-on: windows-latest
    # A new run for the same pull request or branch cancels this job while it is still running.
    concurrency:
      # The same group as gpu-tests.yml, so a run of either workflow cancels the Windows run of the other.
      group: windows-tests-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      GSHARP_TEST_NO_CUDA: "1"
      DiffEngine_Disabled: "true"

    steps:
      - name: Enable long paths in Git (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore -c Release

      - name: Run Static Compilation & Syntax Tests
        env:
          GSHARP_TEST_NO_CUDA: "1"
        run: dotnet test --filter "Category!=GpuExecution" --no-build -c Release

      - name: Run CPU Native Toolchain Execution Tests
        env:
          GSHARP_TEST_NO_CUDA: "1"
        run: dotnet test tests/Compiler/Kassyi.GSharp.Tests.Cpu/Kassyi.GSharp.Tests.Cpu.csproj --filter "Category=GpuExecution&Category!=Stress&Category!=Benchmark" --no-build -c Release
