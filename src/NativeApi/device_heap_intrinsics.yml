# Gpu.Unsafe: the device heap (malloc / free of the CUDA device runtime; the C++ dialect reaches the C runtime ones).
# Merged into GpuIntrinsics.g.cs with ptx_intrinsics.yml by the native-api tool.
namespace: Kassyi.GSharp.Core
className: Gpu

classes:
  - name: Gpu.Unsafe
    xmlDoc: |
      <summary>
      Provides low-level unsafe device memory management intrinsics.
      </summary>
      <remarks>
      Generated from <c>src/NativeApi/device_heap_intrinsics.yml</c>. Calling <see cref="Malloc"/> in a kernel
      or device function reports GSH0029.
      </remarks>

methods:
  - name: Malloc
    nativeName: malloc
    className: Gpu.Unsafe
    isUnsafe: true
    xmlDoc: |
      <summary>
      Allocates unmanaged memory on the GPU device heap (<c>malloc</c>; the C++ dialect maps it to the C runtime <c>malloc</c>).
      </summary>
      <param name="size">The number of bytes to allocate.</param>
      <returns>A raw pointer to the allocated memory block, or <c>null</c> when the allocation fails.</returns>
      <exception cref="GpuOnlyException">Thrown when evaluated on the host CPU.</exception>
    returnType: void*
    parameters:
      - name: size
        type: int

  - name: Free
    nativeName: free
    className: Gpu.Unsafe
    isUnsafe: true
    xmlDoc: |
      <summary>
      Frees unmanaged memory allocated by <see cref="Malloc"/> (<c>free</c>).
      </summary>
      <param name="ptr">A raw pointer to the allocated memory block to free.</param>
      <exception cref="GpuOnlyException">Thrown when evaluated on the host CPU.</exception>
    parameters:
      - name: ptr
        type: void*
