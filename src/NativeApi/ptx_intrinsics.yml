namespace: Kassyi.GSharp.Core
className: Gpu

methods:
  # ===========================================================================
  # 1. Gpu Bitwise, Arithmetic & Basic Operations
  # ===========================================================================
  - name: BitReverse
    nativeName: __brev
    summary: Reverses the bit order of a 32-bit unsigned integer using the __brev hardware instruction.
    returnType: uint
    returnDescription: The bit-reversed 32-bit unsigned integer.
    parameters:
      - name: val
        type: uint
        description: The 32-bit unsigned integer whose bits are to be reversed.

  - name: AtomicAdd
    nativeName: atomicAdd
    managed: ManagedAtomics.Add
    summary: Atomically adds a value to the target address and returns the old value.
    typeTemplate:
      placeholder: T
      types: [int, uint, ulong, float]
    returnType: T
    returnDescription: The original value stored at the address before the addition.
    parameters:
      - name: address
        type: ref T
        description: The reference to the memory location to modify.
      - name: val
        type: T
        description: The value to add.

  - name: AtomicSub
    nativeName: atomicSub
    managed: ManagedAtomics.Sub
    summary: Atomically subtracts an integer value from the target address and returns the old value.
    typeTemplate:
      placeholder: T
      types: [int, uint]
    returnType: T
    returnDescription: The original value stored at the address before the subtraction.
    parameters:
      - name: address
        type: ref T
        description: The reference to the memory location to modify.
      - name: val
        type: T
        description: The value to subtract.

  - name: AddWithCarry
    nativeName: __gsharp_add_cc
    summary: Adds two unsigned 32-bit integers with carry-in and carry-out propagation.
    returnType: uint
    returnDescription: The 32-bit addition result.
    parameters:
      - name: a
        type: uint
        description: The first operand.
      - name: b
        type: uint
        description: The second operand.
      - name: carry
        type: ref ulong
        description: The carry-in value (0 or 1), updated with the carry-out result.

  - name: SubWithBorrow
    nativeName: __gsharp_sub_cc
    summary: Subtracts two unsigned 32-bit integers with borrow-in and borrow-out propagation.
    returnType: uint
    returnDescription: The 32-bit subtraction result.
    parameters:
      - name: a
        type: uint
        description: The minuend operand.
      - name: b
        type: uint
        description: The subtrahend operand.
      - name: borrow
        type: ref long
        description: The borrow-in value (0 or 1), updated with the borrow-out result.

  - name: AtomicOr
    nativeName: atomicOr
    managed: ManagedAtomics.Or
    summary: Atomically computes bitwise OR on the target unsigned integer address.
    typeTemplate:
      placeholder: T
      types: [uint, ulong]
    returnType: T
    returnDescription: The original value stored at the address before the operation.
    parameters:
      - name: address
        type: ref T
        description: The reference to the memory location to modify.
      - name: val
        type: T
        description: The value to OR.

  - name: AtomicMax
    nativeName: atomicMax
    managed: ManagedAtomics.Max
    summary: Atomically computes the maximum value between the address content and the supplied value.
    typeTemplate:
      placeholder: T
      types: [uint, ulong]
    returnType: T
    returnDescription: The original value stored at the address before the operation.
    parameters:
      - name: address
        type: ref T
        description: The reference to the memory location to modify.
      - name: val
        type: T
        description: The value to compare.

  - name: MultiplyWide
    nativeName: __gsharp_mul_wide
    summary: Computes the full 64-bit product of two 32-bit unsigned integers without overflow.
    returnType: ulong
    returnDescription: The 64-bit product of a and b.
    parameters:
      - name: a
        type: uint
        description: The first 32-bit unsigned multiplicand.
      - name: b
        type: uint
        description: The second 32-bit unsigned multiplicand.

  - name: MultiplyHigh
    nativeName: __umul64hi
    summary: Computes the high 64 bits of the product of two 64-bit unsigned integers (__umul64hi).
    returnType: ulong
    returnDescription: The most significant 64 bits of the 128-bit product.
    parameters:
      - name: a
        type: ulong
        description: The first 64-bit unsigned multiplicand.
      - name: b
        type: ulong
        description: The second 64-bit unsigned multiplicand.

  - name: FunnelShiftLeft
    nativeName: __funnelshift_l
    summary: Concatenates hi and lo, shifts left by shift, and extracts the most significant 32 bits.
    returnType: uint
    returnDescription: The most significant 32 bits of the shifted 64-bit pair.
    parameters:
      - name: lo
        type: uint
        description: The least significant 32 bits.
      - name: hi
        type: uint
        description: The most significant 32 bits.
      - name: shift
        type: uint
        description: The shift amount in bits (0-31).

  - name: FunnelShiftRight
    nativeName: __funnelshift_r
    summary: Concatenates hi and lo, shifts right by shift, and extracts the least significant 32 bits.
    returnType: uint
    returnDescription: The least significant 32 bits of the shifted 64-bit pair.
    parameters:
      - name: lo
        type: uint
        description: The least significant 32 bits.
      - name: hi
        type: uint
        description: The most significant 32 bits.
      - name: shift
        type: uint
        description: The shift amount in bits (0-31).

  - name: SyncGrid
    nativeName: cg::this_grid().sync
    summary: Synchronizes all threads across the entire cooperative grid (cg::this_grid().sync()).
    returnType: void

  # ===========================================================================
  # 2. Warp Synchronous Primitives
  # ===========================================================================
  - name: ActiveMask
    className: Warp
    nativeName: __activemask
    managed: ManagedGpuContext.ActiveMask
    summary: Returns a 32-bit mask of all currently active threads in the calling warp.
    returnType: uint
    returnDescription: A 32-bit bitmask where bit i corresponds to active lane i. The CPU paths return every lane of the warp that exists in the block, which is the GPU result where every lane reaches the call; GSH0101 reports a call under a thread-dependent condition on the CPU dialects.

  - name: ShuffleSync
    className: Warp
    nativeName: __shfl_sync
    summary: Exchanges a variable between threads within a warp.
    typeTemplate:
      placeholder: T
      types: [int, uint, float]
    returnType: T
    returnDescription: The value of var held by lane srcLane % width of the caller's segment. Reading a lane that does not exist in the block is undefined on CUDA and an InvalidOperationException on the CPU paths.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: var
        type: T
        description: The source value to broadcast from the source lane.
      - name: srcLane
        type: int
        description: The source lane index (0-31) whose value is broadcasted.
      - name: width
        type: int
        description: The sub-warp width in threads, 1, 2, 4, 8, 16 or 32 (default 32); any other width is undefined on CUDA, reported as GSH0095 when constant, and an InvalidOperationException on the CPU paths.
        defaultValue: 32

  - name: ShuffleDownSync
    className: Warp
    nativeName: __shfl_down_sync
    summary: Exchanges a variable from a thread with a higher ID relative to the caller.
    typeTemplate:
      placeholder: T
      types: [int, uint, float, double]
    returnType: T
    returnDescription: The value from the lane delta above the caller, or the caller's own value when that lane is outside the caller's segment. Reading a lane that does not exist in the block is undefined on CUDA and an InvalidOperationException on the CPU paths.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: var
        type: T
        description: The source value to shift.
      - name: delta
        type: uint
        description: The positive lane index offset to shift down by.
      - name: width
        type: int
        description: The sub-warp width in threads, 1, 2, 4, 8, 16 or 32 (default 32); any other width is undefined on CUDA, reported as GSH0095 when constant, and an InvalidOperationException on the CPU paths.
        defaultValue: 32

  - name: ShuffleUpSync
    className: Warp
    nativeName: __shfl_up_sync
    summary: Exchanges a variable from a thread with a lower ID relative to the caller.
    typeTemplate:
      placeholder: T
      types: [int, uint, float]
    returnType: T
    returnDescription: The value from the lane delta below the caller, or the caller's own value when that lane is outside the caller's segment. Reading a lane that does not exist in the block is undefined on CUDA and an InvalidOperationException on the CPU paths.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: var
        type: T
        description: The source value to shift.
      - name: delta
        type: uint
        description: The positive lane index offset to shift up by.
      - name: width
        type: int
        description: The sub-warp width in threads, 1, 2, 4, 8, 16 or 32 (default 32); any other width is undefined on CUDA, reported as GSH0095 when constant, and an InvalidOperationException on the CPU paths.
        defaultValue: 32

  - name: ShuffleXorSync
    className: Warp
    nativeName: __shfl_xor_sync
    summary: Exchanges a variable based on a bitwise XOR of the caller's lane ID.
    typeTemplate:
      placeholder: T
      types: [int, uint, float]
    returnType: T
    returnDescription: The value from the lane laneMask XOR the caller when that lane is in the caller's group of width lanes or an earlier group, or the caller's own value when it is in a later group. Reading a lane that does not exist in the block is undefined on CUDA and an InvalidOperationException on the CPU paths.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: var
        type: T
        description: The source value to exchange.
      - name: laneMask
        type: int
        description: The bitmask used to XOR against the calling thread's lane ID.
      - name: width
        type: int
        description: The sub-warp width in threads, 1, 2, 4, 8, 16 or 32 (default 32); any other width is undefined on CUDA, reported as GSH0095 when constant, and an InvalidOperationException on the CPU paths.
        defaultValue: 32

  - name: BallotSync
    className: Warp
    nativeName: __ballot_sync
    summary: Evaluates predicate for all active threads in the warp and returns an integer whose Nth bit is set if and only if predicate evaluates to non-zero for the Nth thread.
    returnType: uint
    returnDescription: A 32-bit bitmask of thread predicate evaluation results.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: predicate
        type: bool
        description: The boolean condition evaluated by each thread.

  - name: AllSync
    className: Warp
    nativeName: __all_sync
    summary: Evaluates predicate for all active threads in the warp and returns non-zero if and only if predicate evaluates to non-zero for all of them.
    returnType: bool
    returnDescription: True if predicate evaluates to true for all participating threads.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: predicate
        type: bool
        description: The boolean condition evaluated by each thread.

  - name: AnySync
    className: Warp
    nativeName: __any_sync
    summary: Evaluates predicate for all active threads in the warp and returns non-zero if and only if predicate evaluates to non-zero for any of them.
    returnType: bool
    returnDescription: True if predicate evaluates to true for any participating thread.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: predicate
        type: bool
        description: The boolean condition evaluated by each thread.

  - name: ReduceAddSync
    className: Warp
    nativeName: __reduce_add_sync
    summary: Performs a hardware warp reduction sum operation.
    typeTemplate:
      placeholder: T
      types: [int, uint]
    returnType: T
    returnDescription: The sum of val across participating threads.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: val
        type: T
        description: The value contributed by this thread.

  - name: ReduceMinSync
    className: Warp
    nativeName: __reduce_min_sync
    summary: Performs a hardware warp reduction minimum operation.
    typeTemplate:
      placeholder: T
      types: [int, uint]
    returnType: T
    returnDescription: The minimum of val across participating threads.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: val
        type: T
        description: The value contributed by this thread.

  - name: ReduceMaxSync
    className: Warp
    nativeName: __reduce_max_sync
    summary: Performs a hardware warp reduction maximum operation.
    typeTemplate:
      placeholder: T
      types: [int, uint]
    returnType: T
    returnDescription: The maximum of val across participating threads.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: val
        type: T
        description: The value contributed by this thread.

  - name: ReduceAndSync
    className: Warp
    nativeName: __reduce_and_sync
    summary: Performs a hardware warp reduction bitwise AND operation.
    typeTemplate:
      placeholder: T
      types: [int, uint]
    returnType: T
    returnDescription: The bitwise AND of val across participating threads.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: val
        type: T
        description: The value contributed by this thread.

  - name: ReduceOrSync
    className: Warp
    nativeName: __reduce_or_sync
    summary: Performs a hardware warp reduction bitwise OR operation.
    typeTemplate:
      placeholder: T
      types: [int, uint]
    returnType: T
    returnDescription: The bitwise OR of val across participating threads.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: val
        type: T
        description: The value contributed by this thread.

  - name: ReduceXorSync
    className: Warp
    nativeName: __reduce_xor_sync
    summary: Performs a hardware warp reduction bitwise XOR operation.
    typeTemplate:
      placeholder: T
      types: [int, uint]
    returnType: T
    returnDescription: The bitwise XOR of val across participating threads.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit thread participation bitmask.
      - name: val
        type: T
        description: The value contributed by this thread.

  # ===========================================================================
  # 3. Bit Manipulation & Cryptographic Intrinsics
  # ===========================================================================
  - name: PopCount
    nativeName: __popc
    summary: Counts the number of set bits (population count) in a 32-bit unsigned integer.
    returnType: uint
    returnDescription: The number of set bits.
    parameters:
      - name: val
        type: uint
        description: The unsigned 32-bit integer.

  - name: PopCount
    nativeName: __popcll
    summary: Counts the number of set bits (population count) in a 64-bit unsigned integer.
    returnType: uint
    returnDescription: The number of set bits.
    parameters:
      - name: val
        type: ulong
        description: The unsigned 64-bit integer.

  - name: CountLeadingZeros
    nativeName: __clz
    summary: Returns the number of consecutive zero bits starting from the most significant bit of a 32-bit integer.
    returnType: uint
    returnDescription: The count of leading zero bits.
    parameters:
      - name: val
        type: uint
        description: The 32-bit integer to inspect.

  - name: CountLeadingZeros
    nativeName: __clzll
    summary: Returns the number of consecutive zero bits starting from the most significant bit of a 64-bit integer.
    returnType: uint
    returnDescription: The count of leading zero bits.
    parameters:
      - name: val
        type: ulong
        description: The 64-bit integer to inspect.

  - name: BitReverse
    nativeName: __brevll
    summary: Reverses the bit order of a 64-bit unsigned integer using the __brevll hardware instruction.
    returnType: ulong
    returnDescription: The bit-reversed 64-bit unsigned integer.
    parameters:
      - name: val
        type: ulong
        description: The 64-bit unsigned integer whose bits are to be reversed.

  - name: BytePermute
    nativeName: __byte_perm
    summary: Returns selected bytes from two 32-bit unsigned integers according to a selector mask.
    returnType: uint
    returnDescription: The permuted 32-bit result.
    parameters:
      - name: x
        type: uint
        description: First source value.
      - name: y
        type: uint
        description: Second source value.
      - name: selector
        type: uint
        description: Byte selector mask.

  - name: MultiplyHigh
    nativeName: __mulhi
    summary: Computes the high 32 bits of the product of two 32-bit signed integers.
    returnType: int
    returnDescription: The most significant 32 bits of the 64-bit product.
    parameters:
      - name: a
        type: int
        description: The first 32-bit signed multiplicand.
      - name: b
        type: int
        description: The second 32-bit signed multiplicand.

  - name: MultiplyHigh
    nativeName: __mul64hi
    summary: Computes the high 64 bits of the product of two 64-bit signed integers.
    returnType: long
    returnDescription: The most significant 64 bits of the 128-bit product.
    parameters:
      - name: a
        type: long
        description: The first 64-bit signed multiplicand.
      - name: b
        type: long
        description: The second 64-bit signed multiplicand.

  - name: AbsDiff
    nativeName: __sad
    summary: Computes the absolute difference of two signed integers.
    returnType: int
    returnDescription: The absolute difference |a - b|.
    parameters:
      - name: a
        type: int
        description: The first operand.
      - name: b
        type: int
        description: The second operand.

  - name: AbsDiff
    nativeName: __usad
    summary: Computes the absolute difference of two unsigned integers.
    returnType: uint
    returnDescription: The absolute difference |a - b|.
    parameters:
      - name: a
        type: uint
        description: The first operand.
      - name: b
        type: uint
        description: The second operand.

  # ===========================================================================
  # 4. Memory Synchronization, Fences & Timers
  # ===========================================================================
  - name: ThreadFence
    nativeName: __threadfence
    summary: Ensures memory writes are visible across all threads on device.
    returnType: void

  - name: ThreadFenceBlock
    nativeName: __threadfence_block
    summary: Ensures memory writes are visible to all threads in the same block.
    returnType: void

  - name: ThreadFenceSystem
    nativeName: __threadfence_system
    summary: Ensures memory writes are visible across device and host.
    returnType: void

  # --- Hardware Timers ---
  - name: Clock
    nativeName: clock
    summary: Returns the value of a per-multiprocessor cycle counter (32-bit).
    returnType: uint
    returnDescription: The cycle counter value.

  - name: Clock64
    nativeName: clock64
    summary: Returns the value of a per-multiprocessor cycle counter (64-bit).
    returnType: ulong
    returnDescription: The 64-bit cycle counter value.

  # ===========================================================================
  # 5. Additional Hardware Atomics
  # ===========================================================================
  - name: AtomicExch
    nativeName: atomicExch
    managed: ManagedAtomics.Exch
    summary: Atomically exchanges the value at address with val.
    typeTemplate:
      placeholder: T
      types: [int, uint, ulong, float]
    returnType: T
    returnDescription: The original value stored at address.
    parameters:
      - name: address
        type: ref T
        description: The memory location to modify.
      - name: val
        type: T
        description: The value to write.

  - name: AtomicMin
    nativeName: atomicMin
    managed: ManagedAtomics.Min
    summary: Atomically computes the minimum value between the address content and val.
    typeTemplate:
      placeholder: T
      types: [int, uint, ulong]
    returnType: T
    returnDescription: The original value stored at address.
    parameters:
      - name: address
        type: ref T
        description: The memory location to modify.
      - name: val
        type: T
        description: The value to compare.

  - name: AtomicInc
    nativeName: atomicInc
    managed: ManagedAtomics.Inc
    summary: Atomically increments the value at address up to val (wrapping to 0).
    returnType: uint
    returnDescription: The original value stored at address.
    parameters:
      - name: address
        type: ref uint
        description: The memory location to modify.
      - name: val
        type: uint
        description: The maximum limit before wrapping.

  - name: AtomicDec
    nativeName: atomicDec
    managed: ManagedAtomics.Dec
    summary: Atomically decrements the value at address (wrapping to val if <= 0).
    returnType: uint
    returnDescription: The original value stored at address.
    parameters:
      - name: address
        type: ref uint
        description: The memory location to modify.
      - name: val
        type: uint
        description: The wrap value.

  - name: AtomicCAS
    nativeName: atomicCAS
    managed: ManagedAtomics.Cas
    summary: Atomically compares the value in memory with compare and, if equal, stores val in memory.
    typeTemplate:
      placeholder: T
      types: [int, uint, ulong]
    returnType: T
    returnDescription: The original value stored at the address.
    parameters:
      - name: address
        type: ref T
        description: The reference to the memory location to modify.
      - name: compare
        type: T
        description: The value to compare against.
      - name: val
        type: T
        description: The value to store if comparison succeeds.

  - name: AtomicAnd
    nativeName: atomicAnd
    managed: ManagedAtomics.And
    summary: Atomically computes bitwise AND on the target integer address.
    typeTemplate:
      placeholder: T
      types: [int, uint, ulong]
    returnType: T
    returnDescription: The original value stored at the address before the operation.
    parameters:
      - name: address
        type: ref T
        description: The reference to the memory location to modify.
      - name: val
        type: T
        description: The value to AND.

  - name: AtomicXor
    nativeName: atomicXor
    managed: ManagedAtomics.Xor
    summary: Atomically computes bitwise XOR on the target integer address.
    typeTemplate:
      placeholder: T
      types: [int, uint, ulong]
    returnType: T
    returnDescription: The original value stored at the address before the operation.
    parameters:
      - name: address
        type: ref T
        description: The reference to the memory location to modify.
      - name: val
        type: T
        description: The value to XOR.

  # ===========================================================================
  # 6. Advanced Bitwise, Logic & SIMD Intrinsics (BFE/BFI/LOP3/DP4A/SAD4)
  # ===========================================================================
  - name: BitFieldExtract
    nativeName: __gsharp_bfe
    summary: Extracts a bit field from a 32-bit unsigned integer using the PTX bfe instruction.
    returnType: uint
    returnDescription: The extracted bit field.
    parameters:
      - name: a
        type: uint
        description: The source 32-bit unsigned integer.
      - name: pos
        type: int
        description: The starting bit position (0 to 31).
      - name: len
        type: int
        description: The bit field length (0 to 32).

  - name: BitFieldExtract
    nativeName: __gsharp_bfe64
    summary: Extracts a bit field from a 64-bit unsigned integer using the PTX bfe instruction.
    returnType: ulong
    returnDescription: The extracted bit field.
    parameters:
      - name: a
        type: ulong
        description: The source 64-bit unsigned integer.
      - name: pos
        type: int
        description: The starting bit position (0 to 63).
      - name: len
        type: int
        description: The bit field length (0 to 64).

  - name: BitFieldInsert
    nativeName: __gsharp_bfi
    summary: Inserts a bit field into a 32-bit unsigned integer using the PTX bfi instruction.
    returnType: uint
    returnDescription: The result after bit field insertion.
    parameters:
      - name: a
        type: uint
        description: The insert value.
      - name: b
        type: uint
        description: The base target value.
      - name: pos
        type: int
        description: The starting bit position (0 to 31).
      - name: len
        type: int
        description: The bit field length (0 to 32).

  - name: BitFieldInsert
    nativeName: __gsharp_bfi64
    summary: Inserts a bit field into a 64-bit unsigned integer using the PTX bfi instruction.
    returnType: ulong
    returnDescription: The result after bit field insertion.
    parameters:
      - name: a
        type: ulong
        description: The insert value.
      - name: b
        type: ulong
        description: The base target value.
      - name: pos
        type: int
        description: The starting bit position (0 to 63).
      - name: len
        type: int
        description: The bit field length (0 to 64).

  - name: Lop3
    nativeName: __gsharp_lop3
    summary: Computes an arbitrary 3-input bitwise logic operation defined by an 8-bit lookup table (LUT) using the PTX lop3 instruction.
    returnType: uint
    returnDescription: The result of the 3-input logic function.
    parameters:
      - name: a
        type: uint
        description: The first 32-bit input.
      - name: b
        type: uint
        description: The second 32-bit input.
      - name: c
        type: uint
        description: The third 32-bit input.
      - name: immLut
        type: byte
        description: The 8-bit immediate truth table lookup.

  - name: CountTrailingZeros
    nativeName: __gsharp_tzc_32
    summary: Returns the number of consecutive zero bits starting from the least significant bit of a 32-bit integer.
    returnType: uint
    returnDescription: The count of trailing zero bits.
    parameters:
      - name: val
        type: uint
        description: The 32-bit integer to inspect.

  - name: CountTrailingZeros
    nativeName: __gsharp_tzc_64
    summary: Returns the number of consecutive zero bits starting from the least significant bit of a 64-bit integer.
    returnType: uint
    returnDescription: The count of trailing zero bits.
    parameters:
      - name: val
        type: ulong
        description: The 64-bit integer to inspect.

  - name: BitReverse64
    nativeName: __brevll
    summary: Reverses the bit order of a 64-bit unsigned integer using the __brevll hardware instruction.
    returnType: ulong
    returnDescription: The bit-reversed 64-bit unsigned integer.
    parameters:
      - name: val
        type: ulong
        description: The 64-bit unsigned integer whose bits are to be reversed.

  - name: DotProduct4
    nativeName: __dp4a
    summary: Computes the 4-way 8-bit integer dot product with 32-bit accumulation using the __dp4a hardware intrinsic.
    typeTemplate:
      placeholder: T
      types: [int, uint]
    returnType: T
    returnDescription: The dot product result accumulated with c.
    parameters:
      - name: a
        type: T
        description: The first vector of 4 packed 8-bit integers.
      - name: b
        type: T
        description: The second vector of 4 packed 8-bit integers.
      - name: c
        type: T
        description: The 32-bit accumulator.

  - name: Sad4
    nativeName: __gsharp_vabsdiff4
    summary: Computes the SIMD sum of absolute differences of 4 packed unsigned bytes and accumulates with c (PTX vabsdiff4).
    returnType: uint
    returnDescription: The sum of byte differences accumulated with c.
    parameters:
      - name: a
        type: uint
        description: The first 32-bit operand with 4 packed bytes.
      - name: b
        type: uint
        description: The second 32-bit operand with 4 packed bytes.
      - name: c
        type: uint
        description: The accumulator.

  # ===========================================================================
  # 7. Warp Synchronous Match & Execution Control
  # ===========================================================================
  - name: MatchAnySync
    nativeName: __match_any_sync
    summary: Performs a broadcast-and-compare operation across threads in a warp, returning a mask of threads holding the same value.
    typeTemplate:
      placeholder: T
      types: [int, uint, long, ulong, float, double]
    returnType: uint
    returnDescription: A bitmask of lanes within mask that hold value.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit participating lane mask.
      - name: value
        type: T
        description: The value to compare.

  - name: MatchAllSync
    nativeName: __match_all_sync
    summary: Tests whether all threads in mask hold the same value, returning the mask if true and updating the predicate flag.
    typeTemplate:
      placeholder: T
      types: [int, uint, long, ulong, float, double]
    returnType: uint
    returnDescription: A bitmask of lanes if all match; otherwise 0.
    parameters:
      - name: mask
        type: uint
        description: The 32-bit participating lane mask.
      - name: value
        type: T
        description: The value to compare.
      - name: pred
        type: ref int
        description: Output predicate set to 1 if all threads match, 0 otherwise.

  - name: NanoSleep
    nativeName: __nanosleep
    summary: Suspends the calling thread for approximately the specified duration in nanoseconds.
    returnType: void
    parameters:
      - name: duration
        type: uint
        description: The duration to sleep in nanoseconds.

  - name: SyncWarp
    nativeName: __syncwarp
    summary: Causes executing threads to wait until all warp threads specified in mask have executed the instruction.
    returnType: void
    parameters:
      - name: mask
        type: uint
        defaultValue: 0xFFFFFFFFU
        description: The 32-bit mask of participating threads.

  - name: ReductionAdd
    nativeName: atomicAdd
    managed: ManagedAtomics.Add
    summary: Performs a fire-and-forget reduction addition directly in memory.
    typeTemplate:
      placeholder: T
      types: [int, uint, ulong, float]
    returnType: void
    parameters:
      - name: address
        type: ref T
        description: The memory address to update.
      - name: val
        type: T
        description: The value to add.

  # ===========================================================================
  # 8. Extended Arithmetic - Multi-Precision / BigInt
  # ===========================================================================
  - name: MultiplyAddWide
    nativeName: __gsharp_mad_wide
    summary: Computes (a * b) + c with full 64-bit precision without intermediate overflow.
    returnType: ulong
    returnDescription: The 64-bit result of (a * b) + c.
    parameters:
      - name: a
        type: uint
        description: The first 32-bit unsigned multiplicand.
      - name: b
        type: uint
        description: The second 32-bit unsigned multiplicand.
      - name: c
        type: ulong
        description: The 64-bit unsigned addend.

  - name: MultiplyAddWide
    nativeName: __gsharp_mad_wide_s
    summary: Computes (a * b) + c with full 64-bit signed precision without intermediate overflow.
    returnType: long
    returnDescription: The 64-bit result of (a * b) + c.
    parameters:
      - name: a
        type: int
        description: The first 32-bit signed multiplicand.
      - name: b
        type: int
        description: The second 32-bit signed multiplicand.
      - name: c
        type: long
        description: The 64-bit signed addend.

  - name: MultiplyAddWideWithCarry
    nativeName: __gsharp_madc_cc
    summary: Computes (a * b) + c + carry-in with carry-out propagation.
    returnType: ulong
    returnDescription: The 64-bit result.
    parameters:
      - name: a
        type: uint
        description: The first 32-bit unsigned multiplicand.
      - name: b
        type: uint
        description: The second 32-bit unsigned multiplicand.
      - name: c
        type: ulong
        description: The 64-bit unsigned addend.
      - name: carry
        type: ref ulong
        description: The carry-in value (0 or 1), updated with the carry-out result.

  # ===========================================================================
  # 9. Special Registers & Hardware IDs
  # ===========================================================================
  - name: LaneId
    nativeName: __lane_id
    summary: Returns the lane ID of the calling thread within its warp (0-31).
    returnType: int
    returnDescription: The lane index within the current warp.

  - name: WarpId
    nativeName: __warp_id
    summary: Returns the warp ID of the calling warp within its thread block.
    returnType: int
    returnDescription: The warp index within the current thread block.

  - name: SmId
    nativeName: __smid
    summary: Returns the streaming multiprocessor ID on which the calling thread is executing (%smid).
    returnType: int
    returnDescription: The streaming multiprocessor ID.

  # ===========================================================================
  # 10. Memory, Cache, Async DMA & Barriers
  # ===========================================================================
  - name: LoadCachedGlobal
    nativeName: __ldcg
    summary: Loads data from global memory bypassing the L1 cache directly into registers (PTX ld.cg).
    typeTemplate:
      placeholder: T
      types: [byte, sbyte, short, ushort, int, uint, long, ulong, float, double]
    returnType: T
    returnDescription: The loaded value.
    parameters:
      - name: address
        type: ref T
        description: Reference to the global memory location to load from.

  - name: StoreCachedGlobal
    nativeName: __stcg
    summary: Stores data to global memory caching in L2 only (PTX st.cg).
    typeTemplate:
      placeholder: T
      types: [byte, sbyte, short, ushort, int, uint, long, ulong, float, double]
    returnType: void
    parameters:
      - name: address
        type: ref T
        description: Reference to the global memory location to store into.
      - name: val
        type: T
        description: The value to store.

  - name: Prefetch
    nativeName: __prefetch
    summary: Prefetches data at the specified address into the L2 cache (PTX prefetch.global.L2).
    returnType: void
    parameters:
      - name: address
        type: IntPtr
        description: The memory address to prefetch into L2.

  - name: PrefetchUniform
    nativeName: __prefetchu
    summary: Prefetches uniform data at the specified address into the L1 cache (PTX prefetchu.L1).
    returnType: void
    parameters:
      - name: address
        type: IntPtr
        description: The uniform memory address to prefetch into L1.

  - name: ApplyPriorityL2
    nativeName: __applypriority
    summary: Eviction policy hint for the L2 cache line containing address (PTX applypriority).
    returnType: void
    parameters:
      - name: address
        type: IntPtr
        description: Memory address within the target cache line.
      - name: bytes
        type: uint
        description: Number of bytes to apply the priority to.
      - name: priority
        type: float
        description: The cache eviction priority (0.0 to 1.0).

  - name: ConvertToSharedMemory
    nativeName: __cvta_generic_to_shared
    summary: Converts a generic pointer referencing shared memory to a shared state space address (PTX cvta.to.shared).
    typeTemplate:
      placeholder: T
      types: [byte, int, uint, long, ulong, float, double]
    returnType: IntPtr
    returnDescription: The shared space pointer.
    parameters:
      - name: address
        type: ref T
        description: The reference in shared memory.

  - name: CopyAsync
    nativeName: __gsharp_cp_async
    summary: Issues an uncommitted asynchronous copy from global memory to shared memory on the calling thread (PTX cp.async). Batch issued copies with CopyAsyncCommitGroup and wait with CopyAsyncWaitGroup or CopyAsyncWaitAll; call SyncThreads before other threads read sharedDst. Reading or writing sharedDst, or writing globalSrc, before completion is a data race.
    typeTemplate:
      placeholder: T
      types: [int, uint, float, long, ulong, double, System.Numerics.Vector2, System.Numerics.Vector4]
    returnType: void
    parameters:
      - name: sharedDst
        type: ref T
        description: The destination element in shared memory.
      - name: globalSrc
        type: ref readonly T
        description: The source element in global memory (must refer to a variable or element in global memory, not a temporary value).

  - name: CopyAsyncCommitGroup
    nativeName: __gsharp_cp_async_commit_group
    summary: Batches all prior uncommitted CopyAsync operations issued by the calling thread into a new commit group (PTX cp.async.commit_group).
    returnType: void
    parameters: []

  - name: CopyAsyncWaitGroup
    nativeName: __gsharp_cp_async_wait_group
    summary: Waits until at most pendingGroups committed CopyAsync groups of the calling thread remain pending (PTX cp.async.wait_group; 0 waits for all committed groups of the calling thread). Call SyncThreads after waiting if other threads read the copied shared memory.
    returnType: void
    parameters:
      - name: pendingGroups
        type: int
        description: Maximum number of committed groups of the calling thread allowed to remain pending (must be a compile-time constant in 0..7).

  - name: CopyAsyncWaitAll
    nativeName: __gsharp_cp_async_wait_all
    summary: Waits until all prior CopyAsync operations issued by the calling thread have completed (PTX cp.async.wait_all). Call SyncThreads after waiting if other threads read the copied shared memory.
    returnType: void
    parameters: []

  - name: MBarrierInit
    nativeName: __gsharp_mbarrier_init
    summary: Initializes an asynchronous barrier object in shared memory (PTX mbarrier.init).
    returnType: void
    parameters:
      - name: barrier
        type: ref ulong
        description: The 64-bit mbarrier object in shared memory.
      - name: expectedCount
        type: uint
        description: The number of threads expected to arrive at the barrier.

  - name: MBarrierArrive
    nativeName: __gsharp_mbarrier_arrive
    summary: Signals arrival of the calling thread at the mbarrier object (PTX mbarrier.arrive).
    returnType: void
    parameters:
      - name: barrier
        type: ref ulong
        description: The 64-bit mbarrier object.

  - name: MBarrierWait
    nativeName: __gsharp_mbarrier_wait
    summary: Blocks the calling thread until the barrier completes the specified phase (PTX mbarrier.test_wait).
    returnType: void
    parameters:
      - name: barrier
        type: ref ulong
        description: The 64-bit mbarrier object.
      - name: phase
        type: uint
        description: The phase parity to wait for.
