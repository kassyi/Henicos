# Identifiers the compiler emits into generated host and device code. Each top-level key becomes a nested class of
# GSharpInternalNames. A name is either `Name: value` or `Name: { Value: value, Prelude: File.hpp }`; Prelude names the
# file that declares the identifier, relative to Resources/Prelude (`../Prelude.cu` is the CUDA prelude), which the build
# and PreludeInternalNamesTests check. A name may also carry `Managed: File.cs`, a Kassyi.GSharp.Core source that
# declares the same identifier for managed (C#) kernels; the build checks that too.
# A name ending in Prefix is followed by a counter or another name, and its value ends in `_`.
# Only names that something outside one emitter also spells belong here; see the remarks on GSharpInternalNames.

Kernel:
  Summary: Names that belong to one kernel, followed by the body of its entry point name (GlobalCppNames.GetKernelDerivedName).
  Names:
    LaunchExportPrefix: __gsharp_launch_
    ContextPrefix: __gsharp_context_
    StateMachinePrefix: __gsharp_statemachine_

StateMachine:
  Summary: Per-thread state machine context (CPU dialects).
  Names:
    Context: { Value: __gsharp_ctx, Prelude: WarpAndHints.hpp }
    State: __gsharp_state
    YieldedForGridSync: __gsharp_yielded_for_grid_sync
    # Set when the thread stops at a block barrier (Gpu.SyncThreads); the launcher keeps it waiting there until every
    # thread of the block that has not finished waits too
    YieldedForBlockBarrier: __gsharp_yielded_for_block_barrier
    # The incoming value of a by-value parameter that the body writes; the state machine reads the copy in its context
    CopiedParameterPrefix: __gsharp_in_
    AllContexts: { Value: __gsharp_all_contexts, Prelude: WarpAndHints.hpp }
    # The warp collectives of a thread (#1468): the two values it published last, which slot it writes next, the round
    # of the launcher it runs in, and whether it waits for the lanes of a mask
    WarpRecordType: { Value: __gsharp_warp_record, Prelude: WarpAndHints.hpp }
    WarpRecords: { Value: __gsharp_warp_records, Prelude: WarpAndHints.hpp }
    WarpRecordNext: { Value: __gsharp_warp_record_next, Prelude: WarpAndHints.hpp }
    WarpRound: { Value: __gsharp_warp_round, Prelude: WarpAndHints.hpp }
    WarpWaiting: { Value: __gsharp_warp_waiting, Prelude: WarpAndHints.hpp }
    # How often a frame reached each warp collective of its body
    WarpVisits: { Value: __gsharp_warp_visits, Prelude: WarpAndHints.hpp }
    # The branches and loops a thread is inside in a kernel that reaches Warp.ActiveMask() (#844), innermost last, and
    # whether it waits where one of them ends for the other lanes that entered it, since which round and where
    WarpRegions: { Value: __gsharp_warp_regions, Prelude: WarpAndHints.hpp }
    WarpInstanceType: { Value: __gsharp_warp_instance, Prelude: WarpAndHints.hpp }
    WarpRegionDepth: { Value: __gsharp_warp_region_depth, Prelude: WarpAndHints.hpp }
    WarpReconverging: { Value: __gsharp_warp_reconverging, Prelude: WarpAndHints.hpp }
    WarpReconvergeRound: { Value: __gsharp_warp_reconverge_round, Prelude: WarpAndHints.hpp }
    WarpReconvergeLocation: { Value: __gsharp_warp_reconverge_location, Prelude: WarpAndHints.hpp }
    # The round in which the waiting lanes of the warp were last decided (kept by its lane 0) and whether this lane goes on
    WarpDecidedRound: { Value: __gsharp_warp_decided_round, Prelude: WarpAndHints.hpp }
    WarpMayPass: { Value: __gsharp_warp_may_pass, Prelude: WarpAndHints.hpp }
    # The managed path numbers the frames of a thread to tell the paths through device functions apart (the native
    # path uses the offset of the frame in the kernel context)
    WarpPath: __gsharp_warp_path
    NumberWarpPaths: __gsharp_number_warp_paths

SuspendingCall:
  Summary: >-
    Device functions that reach a barrier (CPU dialects). Each one is a state machine with its own frame; the kernel
    context is passed down as the root, which owns the values the thread published at warp collectives.
  Names:
    Root: { Value: __gsharp_root, Prelude: WarpAndHints.hpp }
    FrameTypePrefix: __gsharp_frame_
    CallFramePrefix: __gsharp_call_frame_
    Result: __gsharp_result
    # Marks a call to a device function that may suspend: __gsharp_resume(call, frameIndex[, result]).
    ResumeCall: __gsharp_resume

ManagedVersion:
  Summary: >-
    The managed C# of operator macros (#711). A device function that expands one, directly or through a device function
    it calls, gets a managed version in its partial class, which the managed bodies G# emits call instead of it.
  Names:
    # Followed by the body of the function's name (GlobalCppNames.GetKernelDerivedName).
    MethodPrefix: __gsharp_managed_
    # The temporaries of one expanded operator macro: the result of an inner operator macro, or an operand evaluated
    # before it in the C# order (__gsharp_macro_tmp_<n>).
    MacroTempPrefix: __gsharp_macro_tmp_
    # The nested class that holds the [UnsafeAccessor] stub through which a managed body calls an operator macro target it
    # cannot name (ManagedAccessorSet): followed by the body of the body's function name and a counter
    # (__gsharp_accessor_<path>_<n>).
    AccessorPrefix: __gsharp_accessor_
    # Binds the receiver of a reduced extension method group to its managed version at the time the delegate is created
    # (__gsharp_bind(receiver, global::Type.__gsharp_managed_F), #940).
    Bind: { Value: __gsharp_bind, Managed: ManagedGpuContext.Bind.cs }

DynamicSharedMemory:
  Summary: >-
    The placement of dynamic SharedMemory<T> declarations (CUDA). A kernel that reaches one owns a per-thread table of
    the regions, one slot per declaration; the device functions that reach one receive a pointer to it as their last
    parameter.
  Names:
    # Followed by the body of the kernel's entry point name (GlobalCppNames.GetKernelDerivedName).
    TableTypePrefix: __gsharp_dsmem_
    Table: __gsharp_dsmem
    TableStorage: __gsharp_dsmem_storage

Lowering:
  Summary: Lowering temporaries and labels. Prefixes are followed by a counter or a user-derived name.
  Names:
    LabelPrefix: __gsharp_
    WarpTempPrefix: __gsharp_warp_temp_
    CallTempPrefix: __gsharp_call_temp_
    ArgumentTempPrefix: __gsharp_arg_temp_
    # The temporaries of EvaluationOrder: the emitter declares them, but like the lowering temporaries above they keep
    # the C# order of evaluation, so they share the group
    SequenceTempPrefix: __gsharp_seq_
    ConditionTempPrefix: __gsharp_cond_temp_
    # The governing value of a switch statement that lowering flattens because a section holds a split point
    # (SwitchStatementFlattener); its labels are __gsharp_SwitchSection_<id>_<section> and __gsharp_SwitchEnd_<id>
    SwitchTempPrefix: __gsharp_switch_temp_
    AggregateTemp: __gsharp_tmp
    TupleTempPrefix: __gsharp_tuple_
    CoalesceTarget: __gsharp_coalesce_target
    CoalesceTemp: __gsharp_coalesce_tmp
    SwitchStatePrefix: __gsharp_switch_
    ConstructorPrefix: __gsharp_ctor_
    ConstructorSelf: __gsharp_self
    ForEachSourcePrefix: __gsharp_foreach_src_
    ForEachIndexPrefix: __gsharp_foreach_i_
    # The raw element of a C++ range-for whose loop variable converts it with a .NET conversion helper (#995):
    # for (auto __gsharp_foreach_e_<n> : <source>) { int x = __gsharp_to_i32(__gsharp_foreach_e_<n>); ... }
    ForEachElementPrefix: __gsharp_foreach_e_
    # The index of a foreach over a constant string, which reads each UTF-16 code unit (ConstantStringForEach):
    # for(int __gsharp_foreach_s_<n> = 0; ...) { char c = __gsharp_string_char(u"...", __gsharp_foreach_s_<n>); ... }
    ForEachStringIndexPrefix: __gsharp_foreach_s_
    UnrollIndexPrefix: __gsharp_unroll_
    # The unsigned index of a Gpu.GridStrideLoop and its count and step, each read once before the loop (__gsharp_gsl_<n>,
    # __gsharp_gsl_n_<n>, __gsharp_gsl_s_<n>); the C++ emitter and the managed rewrite both spell them
    GridStrideIndexPrefix: __gsharp_gsl_
    GridStrideCountPrefix: __gsharp_gsl_n_
    GridStrideStepPrefix: __gsharp_gsl_s_
    # The same three of a Gpu.GridStrideLoop whose body splits the state machine, which the CPU lowering turns into a loop
    # (PreLoweringExpander): names of their own, so that they never meet those of a loop that an emitter writes
    LoweredGridStrideIndexPrefix: __gsharp_lgsl_
    LoweredGridStrideCountPrefix: __gsharp_lgsl_n_
    LoweredGridStrideStepPrefix: __gsharp_lgsl_s_
    # The done flag of a Gpu.SyncGrid(body) with a return (__gsharp_sg_done_<body>) and the label after the statement that
    # returns (__gsharp_sg_next_<body>_<statement>); the CUDA emitter and the CPU lowering both spell them
    SyncGridDonePrefix: __gsharp_sg_done_
    SyncGridNextLabelPrefix: __gsharp_sg_next_
    # The end of a loop body where the lanes that continue wait for the others (__gsharp_ReconvergeContinue_<n>, #844)
    ReconvergeContinueLabelPrefix: __gsharp_ReconvergeContinue_
    # The label after a Gpu.SingleThread body with a return (__gsharp_st_end_<body>), which a return of the body jumps to;
    # the C++ emitter and the managed rewrite both spell it
    SingleThreadEndLabelPrefix: __gsharp_st_end_
    # A ref struct or stackalloc pointer local that a state machine declares again on every resume (ResumeLocals): the
    # index of the loop that zeroes its stackalloc memory where it is declared, and the managed stackalloc storage that the
    # local is bound to there (__gsharp_resume_storage_<local>)
    ResumeFillIndex: __gsharp_resume_fill
    ResumeStoragePrefix: __gsharp_resume_storage_
    # The C++ array behind a stackalloc pointer (int __gsharp_stack_<local>[n]; int* <local> = __gsharp_stack_<local>;), so
    # that the pointer can be incremented and assigned like the C# pointer
    StackStoragePrefix: __gsharp_stack_
    # A label of the user whose name another label of the body also has, in the managed output
    # (__gsharp_label_<ordinal>_<name>); lowering can flatten sibling scopes into one block, and C# forbids two labels of
    # one name there (CS0140, CS0158). The C++ output names labels by symbol instead
    ManagedLabelPrefix: __gsharp_label_

Iterator:
  Summary: Labels synthesized by inlining a device iterator body into a foreach site (IteratorInliner).
  Names:
    EndLabelPrefix: __gsharp_iter_end_
    NextLabelPrefix: __gsharp_iter_next_

Using:
  Summary: >-
    The disposal of a C# using in device code. A struct that has a Dispose method declares it as a member under its own
    name; the guard of each using calls it when its scope ends. On the CPU a catch around the body disposes the
    resources when a failure leaves the using.
  Names:
    ScopeGuard: { Value: __gsharp_using_scope, Prelude: StandardTypes.hpp }
    Failed: { Value: __gsharp_using_failed, Prelude: ErrorChannel.hpp }
    Dispose: { Value: __gsharp_dispose, Prelude: StandardTypes.hpp }
    GuardPrefix: __gsharp_using_guard_
    ResourcePrefix: __gsharp_using_resource_

Launcher:
  Summary: Locals of the CPU C++ launcher and the managed wrappers. Kernel parameters share their scope.
  Names:
    Contexts: __gsharp_contexts
    Error: __gsharp_launch_error
    TotalBlocks: __gsharp_total_blocks
    # The number of blocks of the launch, counted in 64 bits by the managed wrapper (LaunchLimits.CheckLaunch) and
    # passed to the native launcher, and the number of thread contexts of the managed path
    GridBlockCount: __gsharp_launch_block_count
    ContextCount: __gsharp_context_count
    ThreadsPerBlock: __gsharp_threads_per_block
    BlockLoopIndex: __gsharp_block_index
    ThreadLoopIndex: __gsharp_thread_index
    ContextThreadIndex: __gsharp_ctx_tid
    LinearThreadIndex: __gsharp_linear_tid
    ContextItem: __gsharp_launch_ctx
    AnyActive: __gsharp_any_active
    CudaContextScope: __gsharp_cuda_context_scope
    # The CUDA launcher's DeviceArrayRegions: one device region per host array that its struct arguments hold (#707)
    DeviceArrays: __gsharp_device_arrays
    GridDimX: __gsharp_grid_dim_x
    GridDimY: __gsharp_grid_dim_y
    GridDimZ: __gsharp_grid_dim_z
    BlockDimX: __gsharp_block_dim_x
    BlockDimY: __gsharp_block_dim_y
    BlockDimZ: __gsharp_block_dim_z
    BlockX: __gsharp_bx
    BlockY: __gsharp_by
    BlockZ: __gsharp_bz
    ThreadX: __gsharp_tx
    ThreadY: __gsharp_ty
    ThreadZ: __gsharp_tz
    # The sharedMemBytes of the launch, a parameter of the native launcher
    SharedMemBytes: __gsharp_shared_mem_bytes
    # The native launcher of a cooperative kernel (#664): the contexts and shared memory arenas of every block, the state
    # of each block at the end of a grid phase, and whether the next phase starts
    GridContexts: __gsharp_grid_contexts
    BlockArenas: __gsharp_block_arenas
    BlockStatus: __gsharp_block_status
    NextGridPhase: __gsharp_next_grid_phase
    # Whether a thread of the block reached Gpu.SyncGrid in the last step
    GridSyncReached: __gsharp_grid_sync_reached
    StructArgumentPrefix: __gsharp_arg_
    LayoutProbe: __gsharp_layout_probe
    # The round of a block, and whether a thread ran in it, in a kernel that reaches a warp collective (#1468)
    Round: __gsharp_round
    Stepped: __gsharp_stepped
    # Managed host launch wrappers (#406): fixed locals, per-kernel member prefixes, and per-parameter local prefixes
    KernelParams: __gsharp_kernel_params
    # The epoch of a CUDA launch (LaunchErrorRecords.NextLaunchEpoch): the launcher's local and the hidden last
    # parameter of the CUDA kernel, which the kernel stores into the Prelude's LaunchEpoch
    Epoch: __gsharp_epoch
    FunctionHandle: __gsharp_hfunc
    ArchSuffix: __gsharp_arch_suffix
    DllName: __gsharp_dll_name
    DllPath: __gsharp_dll_path
    PinnedHandle: __gsharp_handle
    ContextIndex: __gsharp_context_index
    ThreadAtBlockBarrier: __gsharp_thread_at_block_barrier
    ThreadAtGridSync: __gsharp_thread_at_grid_sync
    AnyGridActive: __gsharp_any_grid_active
    FirstFinishedBlock: __gsharp_first_finished_block
    AnyBlockAtGridSync: __gsharp_any_block_at_grid_sync
    BlockAtGridSyncFlag: __gsharp_block_at_grid_sync_flag
    AnyBlockActive: __gsharp_any_block_active
    # The first exception of a thread of a managed launch; the launch throws it at its end (the other threads run on)
    FirstFailure: __gsharp_first_failure
    # The exception that ends the step of a thread of a managed launch
    Failure: __gsharp_failure
    FunctionPointerFieldPrefix: __gsharp_hfunc_
    LayoutCheckedFieldPrefix: __gsharp_layout_checked_
    DelegateTypePrefix: __gsharp_delegate_
    DevicePointerPrefix: __gsharp_d_
    ProxyPrefix: __gsharp_proxy_
    NullableProxyPrefix: __gsharp_nullable_
    NativePrefix: __gsharp_native_
    PinnedPrefix: __gsharp_p_
    PinnedTempPrefix: __gsharp_p_temp_
    ScalarPointerPrefix: __gsharp_ptr_
    SizePrefix: __gsharp_size_
    ShadowPrefix: __gsharp_shadow_
    SharedShadowPrefix: __gsharp_shared_shadow_
    AllocatedPointersPrefix: __gsharp_allocated_ptrs_
    ElementIndexPrefix: __gsharp_index_
    HostSpanPrefix: __gsharp_host_
    ElementPrefix: __gsharp_element_
    CopySourcePrefix: __gsharp_source_
    CopyBufferPrefix: __gsharp_copy_
    CopyIndexPrefix: __gsharp_copy_index_
    # The C# execution of a launcher (KernelExecution.CSharp): the linear index of the GPU thread that the lambda runs,
    # the copy of the auto result and of each argument that the lambda captures, and the pinned pointer and length of
    # a span argument
    CSharpThread: __gsharp_csharp_thread
    CSharpResult: __gsharp_csharp_result
    CSharpArgumentPrefix: __gsharp_csharp_arg_
    CSharpPinnedPrefix: __gsharp_csharp_pin_
    CSharpLengthPrefix: __gsharp_csharp_len_
    # The launchers of external modules ([CudaImport], YAML moduleName): the static field that holds the bytes of a
    # module, followed by its number in the class; the struct that packs the arguments of a method (PackContext),
    # followed by the method's number in the class, and its local; the local of each kernel argument and of an 'out'
    # value, followed by the parameter ordinal
    ModuleFieldPrefix: __gsharp_module_
    NativeContextTypePrefix: __gsharp_native_context_
    NativeContext: __gsharp_native_context
    KernelArgumentPrefix: __gsharp_karg_
    OutValuePrefix: __gsharp_out_

ReturnValue:
  Summary: The buffer that a kernel returning a value writes into, the device-side locals that fill it, and the launcher locals that convert a returned struct whose layouts differ.
  Names:
    Buffer: __gsharp_auto_result
    BufferSize: __gsharp_auto_result_size
    BufferShadow: __gsharp_auto_result_shadow
    BufferNative: __gsharp_auto_result_native
    BufferIndex: __gsharp_auto_result_index
    GlobalThreadIndex: __gsharp_global_tid
    TotalThreads: __gsharp_total_threads

Prelude:
  Summary: Functions and globals that the Prelude declares, used by the emitters or by the runtime loader.
  Names:
    HostLastError: { Value: __gsharp_host_last_error, Prelude: ErrorChannel.hpp }
    ActiveErrorSlot: { Value: __gsharp_active_error_slot, Prelude: ErrorChannel.hpp }
    Unsupported: { Value: __gsharp_unsupported, Prelude: ErrorChannel.hpp }
    Trap: { Value: __gsharp_trap, Prelude: ErrorChannel.hpp }
    # A failed check ends the kernel step of its thread: Trap, TrapSite, TrapAbort and Unsupported report, then throw
    # __gsharp_step_abort, which the native launcher catches around the step of each thread. TrapAbort is Trap under the
    # name that the CUDA prelude defines as well, where the trap stops the thread
    TrapAbort: { Value: __gsharp_trap_abort, Prelude: ErrorChannel.hpp }
    StepAbort: { Value: __gsharp_step_abort, Prelude: ErrorChannel.hpp }
    # The array that a C# array read (Length, an element, foreach) goes through: a null array fails with
    # NullReferenceException on every build; declared by ErrorChannel.hpp and the CUDA prelude
    ArrayRef: { Value: __gsharp_array_ref, Prelude: ErrorChannel.hpp }
    # An element of such an array, checked after the array and the index are evaluated (C# order)
    ArrayAt: { Value: __gsharp_array_at, Prelude: ErrorChannel.hpp }
    # The array of a Gpu.NotNull call: a null array fails with NullReferenceException, a null kernel argument included
    ArrayNotNull: { Value: __gsharp_array_not_null, Prelude: ErrorChannel.hpp }
    # A by-value struct argument of a device function: the non-nullable array fields it reaches, checked at the call
    StructRef: { Value: __gsharp_struct_ref, Prelude: ErrorChannel.hpp }
    ConsumeLastError: { Value: __gsharp_consume_last_error, Prelude: ErrorChannel.hpp }
    ConsumeLastErrorDetails: { Value: __gsharp_consume_last_error_details, Prelude: ErrorChannel.hpp }
    TrapSite: { Value: __gsharp_trap_site, Prelude: ErrorChannel.hpp }
    ErrorSlot: { Value: __gsharp_error_slot, Prelude: ../Prelude.cu }
    # The records and abort words of the CUDA launches with an epoch, and the epoch of the running launch (a block's
    # shared variable that every thread of a kernel sets first)
    LaunchErrors: { Value: __gsharp_launch_errors, Prelude: ../Prelude.cu }
    LaunchEpoch: { Value: __gsharp_launch_epoch, Prelude: ../Prelude.cu }
    ErrorModuleId: { Value: __gsharp_error_module_id, Prelude: ../Prelude.cu }
    BuiltinMessageId: { Value: __gsharp_builtin_message_id, Prelude: ../Prelude.cu }
    # The CUDA grid barrier of Gpu.SyncGrid(GridSyncMode): Deterministic (also the syncs of a Gpu.SyncGrid(body))
    # and Fast
    GridSync: { Value: __gsharp_grid_sync, Prelude: ../Prelude.cu }
    GridSyncFast: { Value: __gsharp_grid_sync_fast, Prelude: ../Prelude.cu }
    SetThreadIndex: { Value: __gsharp_set_thread_idx, Prelude: ThreadAndMemory.hpp }
    # Gpu.GridStrideLoop: declared by ThreadAndMemory.hpp for the CPU dialects and by the CUDA prelude, and by
    # ManagedGpuContext for the loop that the CPU lowering expands (PreLoweringExpander)
    GridStrideStart: { Value: __gsharp_grid_stride_start, Prelude: ThreadAndMemory.hpp, Managed: ManagedGpuContext.GridStride.cs }
    GridStrideStep: { Value: __gsharp_grid_stride_step, Prelude: ThreadAndMemory.hpp, Managed: ManagedGpuContext.GridStride.cs }
    GridStrideCount: { Value: __gsharp_grid_stride_count, Prelude: ThreadAndMemory.hpp, Managed: ManagedGpuContext.GridStride.cs }
    GridStrideIndex: { Value: __gsharp_grid_stride_index, Prelude: ThreadAndMemory.hpp, Managed: ManagedGpuContext.GridStride.cs }
    # The extern dynamic shared memory buffer of the CUDA prelude; the CPU dialects place dynamic declarations in the
    # arena of ThreadAndMemory.hpp instead.
    DynamicSharedMemory: { Value: __gsharp_dynamic_smem, Prelude: ../Prelude.cu }
    # Declared by the CUDA prelude only.
    DynamicSharedMemorySize: { Value: __gsharp_dynamic_smem_size, Prelude: ../Prelude.cu }
    DynamicSharedMemoryInit: { Value: __gsharp_dsmem_init, Prelude: ../Prelude.cu }
    DynamicSharedMemoryPlace: { Value: __gsharp_dsmem_place, Prelude: ../Prelude.cu }
    ResetSharedMemory: { Value: __gsharp_reset_smem, Prelude: ThreadAndMemory.hpp }
    # The shared memory arena of a block, and the call that makes a block of a cooperative kernel use its own (#664)
    SharedMemoryArena: { Value: __gsharp_block_smem, Prelude: ThreadAndMemory.hpp }
    BindSharedMemory: { Value: __gsharp_bind_smem, Prelude: ThreadAndMemory.hpp }
    # The grid phases of the native launcher of a cooperative kernel (#664)
    BlockAtGridSync: { Value: __gsharp_block_at_grid_sync, Prelude: ThreadAndMemory.hpp }
    BlockFinished: { Value: __gsharp_block_finished, Prelude: ThreadAndMemory.hpp }
    EndGridPhase: { Value: __gsharp_end_grid_phase, Prelude: ThreadAndMemory.hpp }
    ReportRepresentativeFinished: { Value: __gsharp_report_representative_finished, Prelude: ThreadAndMemory.hpp }
    # A CPU SharedMemory<T> declaration: a constant count is static (a buffer of its own), any other count is dynamic (a
    # region of the launch's sharedMemBytes); the native launcher resets the arena of each block
    AllocateStaticSharedMemory: { Value: __gsharp_allocate_smem_static, Prelude: ThreadAndMemory.hpp }
    AllocateDynamicSharedMemory: { Value: __gsharp_allocate_smem_dynamic, Prelude: ThreadAndMemory.hpp }
    # A warp collective publishes the value of the lane before its state boundary; the launcher runs the lane again when
    # the lanes of the mask have met, and reports lanes that never meet (#1468)
    WarpPublish: { Value: __gsharp_warp_publish, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.WarpRendezvous.cs }
    WarpSyncRead: { Value: __gsharp_warp_sync_read, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.WarpRendezvous.cs }
    WarpCanRun: { Value: __gsharp_warp_can_run, Prelude: WarpAndHints.hpp }
    WarpReportStall: { Value: __gsharp_warp_report_stall, Prelude: WarpAndHints.hpp }
    # Warp.ActiveMask() publishes without a mask and reads the lanes that published the same call in the same round; a
    # method that reaches it enters and leaves its thread-dependent branches and loops, and the lanes that entered one
    # wait for each other where it ends (#844)
    WarpActiveMaskRead: { Value: __gsharp_warp_active_mask_read, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.WarpRendezvous.cs }
    WarpRegionEnter: { Value: __gsharp_warp_region_enter, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.WarpRendezvous.cs }
    WarpRegionLeave: { Value: __gsharp_warp_region_leave, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.WarpRendezvous.cs }
    WarpReconvergeArrive: { Value: __gsharp_warp_reconverge_arrive, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.WarpRendezvous.cs }
    WarpReconvergePass: { Value: __gsharp_warp_reconverge_pass, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.WarpRendezvous.cs }
    WarpShuffleReadSync: { Value: __gsharp_warp_shuffle_read_sync, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.cs }
    WarpShuffleReadDownSync: { Value: __gsharp_warp_shuffle_read_down_sync, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.cs }
    WarpShuffleReadUpSync: { Value: __gsharp_warp_shuffle_read_up_sync, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.cs }
    WarpShuffleReadXorSync: { Value: __gsharp_warp_shuffle_read_xor_sync, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.cs }
    WarpMatchAnyRead: { Value: __gsharp_warp_match_any_read_sync, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.cs }
    WarpMatchAllRead: { Value: __gsharp_warp_match_all_read_sync, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.cs }
    # The reads of the warp votes and reductions after their state boundary (#845)
    WarpBallotRead: { Value: __gsharp_warp_ballot_read_sync, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.WarpVotes.cs }
    WarpAllRead: { Value: __gsharp_warp_all_read_sync, Prelude: WarpAndHints.hpp, Managed: ManagedGpuContext.WarpVotes.cs }
