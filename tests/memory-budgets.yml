# Memory budget of the test host of each test assembly, in MB (1 MB = 1048576 bytes).
#
# The watchdog of Kassyi.GSharp.Tests.Infrastructure (MemoryBudget) fails the tests that run when the peak memory of
# the test host passes this value, and a final check per assembly fails when the peak of the whole run passed it.
# The peak is the peak private memory (commit charge) on Windows and the peak resident memory (VmHWM) on Linux.
# tests/Directory.Build.props caps the managed heap at twice the budget (System.GC.HeapHardLimit).
#
# Each value is 1.5 times the largest peak of three runs of the suite on Windows and Linux, rounded up to 64 MB.
# How to measure and update: .agents/rules/test-execution.md (Memory budgets).
#
# Format: one '<test project name>: <MB>' line per test project, at column 0.

