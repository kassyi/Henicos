# Launchers for Native/module_arguments.cu (ModuleArgumentTests). The array parameters are spelled with spaces inside
# and before the rank specifier, which a launcher must still stage through a device buffer.
namespace: Kassyi.GSharp.Tests.Cuda
className: ModuleArgumentKernels
moduleName: module_arguments.gfatbin
methods:
  - name: RecordPointerSpaceInRank
    entryPoint: RecordPointer
    parameters:
      - { name: data, type: "float[ ]" }
      - { name: slots, type: ulong }
  - name: RecordPointerSpaceBeforeRank
    entryPoint: RecordPointer
    parameters:
      - { name: data, type: "float [ ]" }
      - { name: slots, type: ulong }
  - name: Scale
    parameters:
      - { name: data, type: "float[ ]" }
      - { name: n, type: int }
      - { name: factor, type: float }
      - { name: gridDimX, type: uint }
      - { name: blockDimX, type: uint }
