# Known divergences of the differential harness, read once by KnownDivergences.All.
#
# An entry lets the listed columns of a case differ from the oracle on the listed paths; the rest of the case is still
# compared. A listed column must still differ on every listed path that the process runs: once it matches for every
# seed, the test fails and asks for the entry to be removed. A matrix test that finds a new divergence files an issue
# (M1 or M2) and adds an entry under it; the pull request that fixes the issue removes its entries.
#
# One block per issue:
#   issue:   the issue number
#   title:   the issue title, exactly as on GitHub
#   entries: one per case and set of paths
#     case:    the DifferentialCase name, Class.KernelMethod, of a static readonly DifferentialCase field
#     paths:   Managed, Native, Cuda
#     columns: the column names (DiffBuffer.ColumnNameOf), or $exception for an exception mismatch
#     hosts:   optional, Windows or Unix; default: both
#
# KnownDivergencesTests checks that every case and column exists, and, where the gh CLI can reach GitHub, that every
# issue is open and has this title.

- issue: 718
  title: "[Bug]: Array and span bounds, integer division by zero, Nullable.Value, Math.Clamp and Math.Abs(MinValue) are not checked as in C#"
  entries:
    # Span, Slice, ArraySegment, Memory and InlineArray bounds and the bounds-check elimination guards on native
    - case: BoundsAndMemoryDifferentialKernels.SpanCanaryIndexBoundsKernel
      paths: [Native]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.ArraySegmentBoundsKernel
      paths: [Native]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.MemoryBoundsKernel
      paths: [Native]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.InlineArrayBoundsKernel
      paths: [Native]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.BoundsCheckEliminationOffByOneKernel
      paths: [Native]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.BoundsCheckEliminationWrongSpanKernel
      paths: [Native]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.BoundsCheckEliminationPostIncrementKernel
      paths: [Native]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.BoundsCheckEliminationUpperOnlyKernel
      paths: [Native]
      columns: [$exception]
    # Nullable<T>.Value and Math.Clamp traps on native and CUDA
    - case: BclExceptionDifferentialKernels.NullableInt32ValueAccessKernel
      paths: [Native, Cuda]
      columns: [$exception]
    - case: BclExceptionDifferentialKernels.NullableStructValueAccessKernel
      paths: [Native, Cuda]
      columns: [$exception]
    - case: BclExceptionDifferentialKernels.MathClampInt32Kernel
      paths: [Native, Cuda]
      columns: [$exception]
    - case: BclExceptionDifferentialKernels.MathClampSingleKernel
      paths: [Native, Cuda]
      columns: [$exception]
    - case: BclExceptionDifferentialKernels.MathClampDoubleKernel
      paths: [Native, Cuda]
      columns: [$exception]
    # Array and span bounds, bounds-check elimination guards, simultaneous traps and Math.Abs(MinValue) on CUDA: they
    # still diverge after the device error channel of #729 (closed)
    - case: BoundsAndMemoryDifferentialKernels.ArrayIndexBoundsKernel
      paths: [Cuda]
      columns: [$exception]
    # The first element of an empty array argument: native reads past it, CUDA reads EmptyArrayData
    - case: ArrayArgumentNullEmptyDifferentialKernels.NullableArrayKernel.Empty.Element
      paths: [Native, Cuda]
      columns: [$exception]
    - case: ArrayArgumentNullEmptyDifferentialKernels.NonNullableArrayKernel.Empty.Element
      paths: [Native, Cuda]
      columns: [$exception]
    - case: ArrayArgumentNullEmptyDifferentialKernels.ObliviousArrayKernel.Empty.Element
      paths: [Native, Cuda]
      columns: [$exception]
    - case: ArrayArgumentNullEmptyDifferentialKernels.ImmutableKernel.Empty.Element
      paths: [Native, Cuda]
      columns: [$exception]
    # Array.Fill, Clear and Copy past the end of an empty array (length 0) from each source: CUDA does not check
    - case: ArrayCallSourceDifferentialKernels.FieldArrayCallKernel.FillPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.FieldArrayCallKernel.ClearPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.FieldArrayCallKernel.CopyFromPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.ElementArrayCallKernel.FillPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.ElementArrayCallKernel.ClearPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.ElementArrayCallKernel.CopyFromPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.LocalArrayCallKernel.FillPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.LocalArrayCallKernel.ClearPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.LocalArrayCallKernel.CopyFromPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.ParameterArrayCallKernel.FillPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.ParameterArrayCallKernel.ClearPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: ArrayCallSourceDifferentialKernels.ParameterArrayCallKernel.CopyFromPastEnd.Empty
      paths: [Cuda]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.SpanCanaryIndexBoundsKernel
      paths: [Cuda]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.SpanSliceStartKernel
      paths: [Cuda]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.SpanSliceStartCountKernel
      paths: [Cuda]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.ArraySegmentBoundsKernel
      paths: [Cuda]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.MemoryBoundsKernel
      paths: [Cuda]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.InlineArrayBoundsKernel
      paths: [Cuda]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.BoundsCheckEliminationOffByOneKernel
      paths: [Cuda]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.BoundsCheckEliminationWrongSpanKernel
      paths: [Cuda]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.BoundsCheckEliminationPostIncrementKernel
      paths: [Cuda]
      columns: [$exception]
    - case: BoundsAndMemoryDifferentialKernels.BoundsCheckEliminationUpperOnlyKernel
      paths: [Cuda]
      columns: [$exception]
    - case: IntegerTrapAndCheckedDifferentialKernels.MathAbsInt32Kernel
      paths: [Cuda]
      columns: [$exception]

- issue: 904
  title: "[Bug]: GSH0063 warns about SharedMemory<T> declarations on one line instead of giving them distinct keys on the managed path"
  entries:
    # Dynamic SharedMemory<T>(count) inside a non-suspending [GpuDeviceFunction] is not rewritten on the managed path
    - case: PendingBugsDifferentialKernels.HelperDynamicSharedMemoryZeroBytesKernel
      paths: [Managed]
      columns: [$exception]
    - case: PendingBugsDifferentialKernels.HelperDynamicSharedMemoryGrowthAfterLaterDeclKernel
      paths: [Managed]
      columns: [$exception]
    - case: PendingBugsDifferentialKernels.HelperDynamicSharedMemoryNegativeCountKernel
      paths: [Managed]
      columns: [$exception]

- issue: 947
  title: "Math.Abs of the minimum signed value is undefined on native CPU and CUDA but throws in C#"
  entries:
    - case: IntegerTrapAndCheckedDifferentialKernels.MathAbsInt32Kernel
      paths: [Native]
      columns: [$exception]

- issue: 961
  title: "[Bug]: A Nullable<T> whose host and device layouts differ is copied with the host layout on every path (return value, array, argument, struct field)"
  entries:
    # Nullable<T> scalar and by-ref kernel arguments throw MarshalDirectiveException on the native CPU launch
    - case: MarshalingBoundaryDifferentialKernels.NullableBlitScalarArgKernel
      paths: [Native]
      columns: [v_has, v_val, rb_has, rb_val, rb, oc]
    # Nullable<Vector2>: 12 bytes on the host, 16 bytes on CUDA
    - case: MarshalingBoundaryDifferentialKernels.NullableConvertPositionsKernel
      paths: [Cuda]
      columns: [v_x, v_y, rv_x, rv_y, h]
    # [InlineArray(2)] of Nullable<Vector2> is block-copied without a per-element conversion on CUDA
    - case: MarshalingBoundaryDifferentialKernels.InlineArrayNullableVec2Kernel
      paths: [Cuda]
      columns: [item0_x, item0_y, item1_has, item1_x, item1_y, h]


- issue: 1060
  title: "[Bug]: StackLinq ElementAtOrDefault with a negative index enumerates the source and runs upstream side effects"
  entries:
    - case: BclExceptionDifferentialKernels.ElementAtOrDefaultNegativeIndexSideEffectKernel
      paths: [Managed, Native, Cuda]
      columns: [select_neg_eval_count, where_neg_eval_count]


