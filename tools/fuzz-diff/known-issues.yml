# Known issues of the G# compiler that the differential fuzzer (tools/fuzz-diff) steers around, read by
# KnownIssueFilter.LoadEntries. An "avoid" entry keeps the generator from emitting the shape on the listed profiles, so
# the fuzzer finds other bugs instead of the same one again; --allow-issue <n> turns one back on. Each "avoid" entry
# needs an avoidance handler in KnownIssueFilter / ScalarFuzzGenerator (ScalarFuzzGeneratorTests checks it). The pull
# request that fixes an issue removes its entry.
#
#   issue:             the issue number
#   kind:              avoid
#   summary:           what goes wrong, in one line
#   profiles:          the fuzz profiles that avoid it: M (managed), C (native CPU), G (all paths, CUDA included)
#   paths:             the paths where it goes wrong: Managed, Native, Cuda
#   avoidedShape:      what the generator leaves out
#   shapes:            optional, the shape names the generator checks
#   removalCondition:  optional, when the entry may go
#   classifyOnlyPaths: optional, paths where a finding is only classified, not avoided

- issue: 1554
  kind: avoid
  summary: "A stack array live across a barrier fails the native build with no diagnostic"
  profiles: [C, G]
  paths: [Native]
  avoidedShape: "A stack array local (int[] arr = new int[4]) in a split kernel"

- issue: 1079
  kind: avoid
  summary: "8/16-bit integer and char increment/decrement expression value returns widened int or post-increment value"
  profiles: [M, C, G]
  paths: [Native, Cuda]
  avoidedShape: "Pre/post increment or decrement (++ / --) on sbyte, byte, short, ushort, or char in value-consuming expression contexts; only statement-level increment/decrement is emitted when avoided."

- issue: 998
  kind: avoid
  summary: "Null-coalescing operator (??) between Nullable<T> of different widths or narrow Nullable<T> implicit promotion"
  profiles: [M, C, G]
  paths: [Native, Cuda]
  avoidedShape: "Null-coalescing operator (??) where left and right operands have different underlying types or widths, or where a narrow Nullable<T> is implicitly promoted."

- issue: 984
  kind: avoid
  summary: "Nullable<T> local variable declarations fail C++ / CUDA transpilation or runtime lowering"
  profiles: [C, G]
  paths: [Native, Cuda]
  avoidedShape: "Local variable declarations of type Nullable<T> (T?); Nullable<T> is instead exercised via struct fields on profiles C and G."

- issue: 645
  kind: avoid
  summary: "Instance methods of plain structs called from device code are not emitted or diagnosed"
  profiles: [C, G]
  paths: [Native, Cuda]
  avoidedShape: "Calling plain struct instance methods directly from kernels; computed readonly properties and [GpuDeviceFunction] helpers are used when avoided."

- issue: 1102
  kind: avoid
  summary: "Nested tuple deconstruction and a conditional expression on the right of a deconstruction fail with GSH0003"
  profiles: [M, C, G]
  paths: [Managed, Native, Cuda]
  avoidedShape: "Nested tuple deconstruction targets or values ((a, (b, c)) = (x, (y, z))) and conditional expressions on the right-hand side of a deconstruction ((a, b) = cond ? (x, y) : (y, z))."

- issue: 1103
  kind: avoid
  summary: "default(T) leaves the fields of a struct with a conversion operator uninitialized on native and CUDA"
  profiles: [C, G]
  paths: [Native, Cuda]
  avoidedShape: "default(T) or default literal for a struct that declares a user-defined conversion operator or contains such a struct as a field, including reducer local-declaration hoisting to default(T)."
